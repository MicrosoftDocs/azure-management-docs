<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="t d" font-family="Segoe UI, Segoe UI Web, Helvetica, Arial, sans-serif">
  <title id="t">Agents and Tools with Foundry Local architecture</title>
  <desc id="d">Users and applications call the agents execution service. Developers call the agents management service. Agents execution runs agent versions, calls language models, MCP tools, Microsoft Foundry toolboxes, and the knowledge base execution service, which searches indexed, remote MCP, and SQL knowledge sources.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#605e5c"/></marker>
  </defs>
  <rect width="1100" height="660" fill="#ffffff"/>
  <g font-size="13" fill="#323130">
    <!-- Users and apps -->
    <text x="125" y="80" text-anchor="middle" font-size="15" font-weight="600">Users and apps</text>
    <rect x="20" y="100" width="210" height="50" rx="4" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="125" y="121" text-anchor="middle" font-weight="600">Local chat UI</text>
    <text x="125" y="139" text-anchor="middle" fill="#605e5c">/chat</text>
    <rect x="20" y="160" width="210" height="50" rx="4" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="125" y="181" text-anchor="middle" font-weight="600">Your applications</text>
    <text x="125" y="199" text-anchor="middle" fill="#605e5c">OpenAI SDK or REST</text>
    <text x="125" y="240" text-anchor="middle" font-size="15" font-weight="600">Developers</text>
    <rect x="20" y="255" width="210" height="50" rx="4" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="125" y="276" text-anchor="middle" font-weight="600">Setup tools and scripts</text>
    <text x="125" y="294" text-anchor="middle" fill="#605e5c">Agents and Connections APIs</text>

    <!-- Platform -->
    <rect x="270" y="20" width="520" height="620" rx="6" fill="#f5f4fd" stroke="#8a8886"/>
    <text x="530" y="46" text-anchor="middle" font-size="16" font-weight="600">Agents and Tools with Foundry Local</text>
    <text x="530" y="65" text-anchor="middle" fill="#605e5c">Azure Arc-enabled Kubernetes cluster</text>

    <!-- Agent Service -->
    <rect x="290" y="80" width="480" height="275" rx="5" fill="#e8e9fb" stroke="#6b6fd6"/>
    <text x="305" y="101" font-size="14" font-weight="600" fill="#3b3fa8">Agent Service</text>
    <rect x="310" y="110" width="440" height="90" rx="4" fill="#ffffff" stroke="#6b6fd6"/>
    <text x="530" y="140" text-anchor="middle" font-size="14" font-weight="600">Agents execution</text>
    <text x="530" y="160" text-anchor="middle">Responses API · Conversations API</text>
    <text x="530" y="180" text-anchor="middle" fill="#605e5c">Runs an agent version: calls the model and tools</text>
    <rect x="310" y="220" width="210" height="120" rx="4" fill="#ffffff" stroke="#6b6fd6"/>
    <text x="415" y="245" text-anchor="middle" font-size="14" font-weight="600">Agents management</text>
    <text x="325" y="272">• Agents and versions</text>
    <text x="325" y="295">• Model and MCP connections</text>
    <text x="325" y="318">• Knowledge bases</text>
    <rect x="540" y="220" width="210" height="120" rx="4" fill="#ffffff" stroke="#6b6fd6"/>
    <text x="645" y="245" text-anchor="middle" font-size="14" font-weight="600">Knowledge base execution</text>
    <text x="645" y="280" text-anchor="middle">Searches knowledge sources</text>
    <text x="645" y="300" text-anchor="middle">and returns grounded content</text>
    <text x="645" y="320" text-anchor="middle" fill="#605e5c">Exposed to agents as an MCP tool</text>

    <!-- Agentic Retrieval -->
    <rect x="290" y="375" width="480" height="250" rx="5" fill="#f3ebf9" stroke="#9b6bc9"/>
    <text x="300" y="396" font-size="14" font-weight="600" fill="#6b3a99">Agentic Retrieval</text>
    <rect x="310" y="405" width="210" height="60" rx="4" fill="#ffffff" stroke="#9b6bc9"/>
    <text x="415" y="430" text-anchor="middle" font-size="14" font-weight="600">Knowledge sources</text>
    <text x="415" y="450" text-anchor="middle" fill="#605e5c">Indexed, remote MCP, SQL (preview)</text>
    <rect x="540" y="405" width="210" height="60" rx="4" fill="#ffffff" stroke="#9b6bc9"/>
    <text x="645" y="430" text-anchor="middle" font-size="14" font-weight="600">Indexed sources MCP server</text>
    <text x="645" y="450" text-anchor="middle" fill="#605e5c">Searches your collections</text>
    <rect x="310" y="485" width="100" height="50" rx="4" fill="#ffffff" stroke="#9b6bc9"/>
    <text x="360" y="514" text-anchor="middle">Collections API</text>
    <rect x="420" y="485" width="100" height="50" rx="4" fill="#ffffff" stroke="#9b6bc9"/>
    <text x="470" y="514" text-anchor="middle">Inference API</text>
    <rect x="600" y="485" width="150" height="50" rx="4" fill="#ffffff" stroke="#9b6bc9"/>
    <text x="675" y="514" text-anchor="middle">Ingestion API</text>
    <rect x="310" y="560" width="440" height="50" rx="4" fill="#ffffff" stroke="#9b6bc9"/>
    <text x="530" y="590" text-anchor="middle" font-weight="600">Vector and metadata storage</text>

    <!-- External -->
    <rect x="830" y="80" width="250" height="160" rx="5" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="955" y="103" text-anchor="middle" font-size="14" font-weight="600">Language models</text>
    <rect x="845" y="115" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="137" text-anchor="middle">Foundry Local on Azure Local</text>
    <rect x="845" y="155" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="177" text-anchor="middle">Microsoft Foundry</text>
    <rect x="845" y="195" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="217" text-anchor="middle">OpenAI-compatible endpoint</text>

    <rect x="830" y="265" width="250" height="120" rx="5" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="955" y="288" text-anchor="middle" font-size="14" font-weight="600">Tools</text>
    <rect x="845" y="300" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="322" text-anchor="middle">Remote MCP servers</text>
    <rect x="845" y="340" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="362" text-anchor="middle">Microsoft Foundry toolboxes</text>

    <rect x="830" y="470" width="250" height="120" rx="5" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="955" y="493" text-anchor="middle" font-size="14" font-weight="600">Data sources</text>
    <rect x="845" y="505" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="527" text-anchor="middle">NFS share</text>
    <rect x="845" y="545" width="220" height="34" rx="3" fill="#ffffff" stroke="#a19f9d"/>
    <text x="955" y="567" text-anchor="middle">SharePoint Server</text>
  </g>
  <g stroke="#605e5c" stroke-width="1.5" fill="none">
    <path d="M230 125H308" marker-end="url(#a)"/>
    <path d="M230 185H308" marker-end="url(#a)"/>
    <path d="M230 280H308" marker-end="url(#a)"/>
    <path d="M415 200V218" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M645 200V218" marker-end="url(#a)"/>
    <path d="M750 135H828" marker-end="url(#a)"/>
    <path d="M750 180H805V325H828" marker-end="url(#a)"/>
    <path d="M500 340V403" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <path d="M645 340V403" marker-end="url(#a)"/>
    <path d="M560 465V558" marker-end="url(#a)"/>
    <path d="M360 535V558" marker-end="url(#a)"/>
    <path d="M470 535V558" marker-end="url(#a)"/>
    <path d="M675 535V558" marker-end="url(#a)"/>
    <path d="M830 520H752" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#605e5c">
    <text x="420" y="213">reads version</text>
    <text x="505" y="366">groups</text>
  </g>
</svg>