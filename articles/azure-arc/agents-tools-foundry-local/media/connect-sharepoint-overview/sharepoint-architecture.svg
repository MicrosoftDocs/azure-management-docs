<svg xmlns="http://www.w3.org/2000/svg" width="820" height="700" viewBox="0 0 820 700" role="img" aria-labelledby="t d" font-family="Segoe UI, Segoe UI Web, Helvetica, Arial, sans-serif">
  <title id="t">SharePoint server-to-server ingestion architecture</title>
  <desc id="d">A cluster administrator creates a Kubernetes Secret that holds the PFX certificate and password. The ingestion pod reads the selected Secret, signs a JWT locally, and sends it to SharePoint Server, which validates it with the registered public key and returns documents.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#605e5c"/></marker>
  </defs>
  <rect width="820" height="700" fill="#ffffff"/>
  <g font-size="13" fill="#323130">
    <rect x="200" y="20" width="420" height="110" rx="5" fill="#f3f2f1" stroke="#a19f9d"/>
    <text x="410" y="47" text-anchor="middle" font-size="14" font-weight="600">Cluster administrator</text>
    <text x="410" y="75" text-anchor="middle">Creates the Secret in the application namespace</text>
    <text x="410" y="97" text-anchor="middle" fill="#605e5c">Manages the PFX certificate and password</text>

    <rect x="40" y="180" width="740" height="330" rx="6" fill="#e8e9fb" stroke="#6b6fd6"/>
    <text x="60" y="204" font-size="14" font-weight="600" fill="#3b3fa8">Kubernetes cluster (application namespace)</text>

    <rect x="200" y="220" width="420" height="100" rx="4" fill="#ffffff" stroke="#6b6fd6"/>
    <text x="410" y="248" text-anchor="middle" font-size="14" font-weight="600">Kubernetes Secret</text>
    <text x="410" y="272" text-anchor="middle">Keys: cert.pfx and cert-password</text>
    <text x="410" y="294" text-anchor="middle" fill="#605e5c">Each data source selects its Secret</text>

    <rect x="200" y="370" width="420" height="120" rx="4" fill="#ffffff" stroke="#6b6fd6"/>
    <text x="410" y="398" text-anchor="middle" font-size="14" font-weight="600">Ingestion pod</text>
    <text x="410" y="422" text-anchor="middle">Reads the Secret selected by the source</text>
    <text x="410" y="444" text-anchor="middle">Signs the JWT locally</text>
    <text x="410" y="466" text-anchor="middle" fill="#605e5c">No external token-service call</text>

    <rect x="200" y="570" width="420" height="100" rx="5" fill="#f3ebf9" stroke="#9b6bc9"/>
    <text x="410" y="598" text-anchor="middle" font-size="14" font-weight="600">SharePoint Server Subscription Edition</text>
    <text x="410" y="622" text-anchor="middle">Validates the JWT with the registered public key</text>
    <text x="410" y="644" text-anchor="middle" fill="#605e5c">Returns documents</text>
  </g>
  <g stroke="#605e5c" stroke-width="1.5" fill="none">
    <path d="M410 130V218" marker-end="url(#a)"/>
    <path d="M410 320V368" marker-end="url(#a)"/>
    <path d="M360 490V568" marker-end="url(#a)"/>
    <path d="M460 568V492" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#605e5c">
    <text x="420" y="155">1. Create the Secret</text>
    <text x="420" y="350">2. Source selects the Secret</text>
    <text x="180" y="535">3. HTTPS request with signed JWT</text>
    <text x="470" y="535">4. Documents</text>
  </g>
</svg>
